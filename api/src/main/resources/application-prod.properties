# ─── Perfil de Producción ─────────────────────────────────────────────────────
# Se activa con: SPRING_PROFILES_ACTIVE=prod

# Railway usa un proxy que termina SSL, esto hace que Spring genere URLs con https://
server.forward-headers-strategy=framework

# DB — Railway provee variables individuales de PostgreSQL
spring.datasource.url=jdbc:postgresql://${PGHOST}:${PGPORT}/${PGDATABASE}
spring.datasource.username=${PGUSER}
spring.datasource.password=${PGPASSWORD}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false

# JWT
jwt.secret=${JWT_SECRET}
jwt.expiration=${EXPIRATION:86400000}

# Mail — Brevo HTTP API
brevo.api.key=${BREVO_API_KEY:placeholder}
mail.from.email=${MAIL_FROM:noreply@nodevix.site}
mail.from.name=${MAIL_FROM_NAME:NodeVix}

# OAuth2 Google (desactivar si no se configura)
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder}
spring.security.oauth2.client.registration.google.scope=profile,email
