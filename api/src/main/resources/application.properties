spring.application.name=nodevix
spring.datasource.url=jdbc:postgresql://localhost:5432/demo
spring.datasource.username=${POSTGRES_USER:postgres}
spring.datasource.password=${POSTGRES_PASSWORD:postgres}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true
jwt.secret=${JWT_SECRET:nodevix-dev-secret-key-change-in-production}
jwt.expiration=${EXPIRATION:86400000}
resend.api.key=${RESEND_API_KEY:re_placeholder}
resend.from=${RESEND_FROM:NodeVix <onboarding@resend.dev>}
spring.security.oauth2.client.registration.google.client-id=${GOOGLE_CLIENT_ID:placeholder}
spring.security.oauth2.client.registration.google.client-secret=${GOOGLE_CLIENT_SECRET:placeholder}
spring.security.oauth2.client.registration.google.scope=profile,email

